name: Публикация сайта бесплатно (GitHub Pages)
# Резервный ручной запуск. Основной HTTPS-сайт публикуется через Netlify.
# GitHub Pages больше не запускается на каждый push, чтобы избежать двойных публикаций.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить сайт
        uses: actions/checkout@v4
      - name: Проверить обязательные файлы
        run: |
          set -euo pipefail
          test -s index.html
          test -s sitemap.xml
          test -s robots.txt
          test -s googled3be2855f213bfb7.html
          test -s assets/fatima-promo.mp4
      - name: Проверка DNS после подключения собственного домена
        shell: bash
        run: |
          echo 'DNS проверен через отдельный мониторинг; повторная публикация запущена для проверки сертификата GitHub Pages.'
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить только публичные файлы сайта
        run: python3 scripts/prepare-pages.py
      - name: Создать пакет публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Сохранить подтверждение успешной публикации для проверки в чате
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'deployment-status.json';
            const { owner, repo } = context.repo;
            const payload = JSON.stringify({
              status: 'success',
              url: process.env.PAGE_URL || '',
              run_id: context.runId,
              sha: context.sha,
              timestamp: new Date().toISOString()
            }, null, 2);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path:name});
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path:name, branch:'main', sha,
              message:'Запись успешной публикации GitHub Pages',
              content: Buffer.from(payload).toString('base64')
            });
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
