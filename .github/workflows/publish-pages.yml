name: Публикация сайта бесплатно (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить сайт
        uses: actions/checkout@v4
      - name: Проверить обязательные файлы
        run: |
          set -euo pipefail
          test -s index.html
          test -s sitemap.xml
          test -s robots.txt
          test -s googled3be2855f213bfb7.html
          test -s assets/fatima-promo.mp4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Создать пакет публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
