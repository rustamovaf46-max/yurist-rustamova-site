name: ZEUS Technical SEO Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/seo_audit.py'
      - 'scripts/reg-ru-deploy.sh'
      - '.htaccess'
      - 'tests/test_site_security.py'
      - 'tests/test_contact_integrity.py'
      - 'tests/test_public_page_attack_surface.py'
      - '.github/workflows/zeus-seo-audit.yml'
permissions:
  contents: read
concurrency:
  group: zeus-seo-audit
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate REG.RU publishing shell and canonical rules
        run: |
          sh -n scripts/reg-ru-deploy.sh
          grep -q 'BEGIN ZEUS CANONICAL' .htaccess
          grep -q 'END ZEUS CANONICAL' .htaccess
          grep -q 'R=301' .htaccess
      - name: Test server security and privacy safeguards
        run: python3 -m unittest discover -s tests -p 'test_site_security.py' -v
      - name: Ensure no phone / MAX substitution on all public pages
        run: python3 -m unittest discover -s tests -p 'test_contact_integrity.py' -v
      - name: Prevent injected scripts, frames and hidden lead-capture elements
        run: python3 -m unittest discover -s tests -p 'test_public_page_attack_surface.py' -v
      - name: Audit all published pages and sitemap
        run: python3 scripts/seo_audit.py
