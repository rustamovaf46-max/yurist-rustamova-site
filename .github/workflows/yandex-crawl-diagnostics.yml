name: Проверка доступности сайта для робота Яндекса

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/yandex-crawl-diagnostics.yml

permissions:
  contents: read

jobs:
  yandex-crawl-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Проверить ответы REG.RU с User-Agent Яндекс.Бота
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          base = "https://xn--80aafwvmkbibjcl2m.xn--p1ai"
          bot = "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)"
          browser = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/135.0 Safari/537.36"

          def fetch(path, ua, text=True):
              req = urllib.request.Request(base + path, headers={
                  "User-Agent": ua, "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=35) as response:
                  url = response.geturl()
                  status = response.status
                  xrobots = response.headers.get("X-Robots-Tag", "")
                  data = response.read()
                  final = urlparse(url)
                  if status != 200 or final.scheme != "https" or final.netloc != urlparse(base).netloc:
                      raise RuntimeError(f"Unexpected response: {path}, {status}, final={url}")
                  if "noindex" in xrobots.lower() or "none" in xrobots.lower():
                      raise RuntimeError(f"Blocked X-Robots-Tag on {path}: {xrobots}")
                  return data.decode("utf-8") if text else data

          class MetaCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.noindex = False
                  self.canonical = []
                  self.h1 = 0
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "meta" and a.get("name", "").lower() in ("robots", "yandex", "yandexbot") and "noindex" in a.get("content", "").lower():
                      self.noindex = True
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonical.append(a.get("href", ""))
                  if tag == "h1":
                      self.h1 += 1
                  if tag == "a":
                      self.links.add(a.get("href",""))

          robots = fetch("/robots.txt", bot)
          if "Disallow: /" in robots or base + "/sitemap.xml" not in robots:
              raise RuntimeError("Robots must allow crawling and announce sitemap")
          xml = fetch("/sitemap.xml", bot)
          live_urls = [el.text.strip() for el in ET.fromstring(xml).iter()
                       if el.tag.endswith("loc") and el.text]
          local_urls = [el.text.strip() for el in ET.parse("sitemap.xml").getroot().iter()
                        if el.tag.endswith("loc") and el.text]
          if set(live_urls) != set(local_urls) or not live_urls:
              raise RuntimeError("Sitemap of REG.RU is missing URLs from GitHub")
          print(f"ROBOTS & SITEMAP PASS: {len(live_urls)} URLs, HTTPS, YandexBot user agent", flush=True)

          home_links = set()
          for url in live_urls:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.netloc != urlparse(base).netloc:
                  raise RuntimeError("External or unsecure sitemap URL: " + url)
              path = parsed.path or "/"
              page = fetch(path, bot)
              p = MetaCheck()
              p.feed(page)
              if p.noindex or p.h1 != 1 or p.canonical != [url]:
                  raise RuntimeError(f"YandexBot page problem {url}: noindex={p.noindex}, h1={p.h1}, canonicals={p.canonical}")
              if path == "/":
                  home_links = p.links
              if path in ("/", "/predstavitelstvo-v-sude-moskva.html"):
                  other = fetch(path, browser)
                  if not ("Судеб" in page and "Судеб" in other):
                      raise RuntimeError("Significant content unavailable to visitor or Yandex UA: " + path)
              print("YANDEX-UA PASS:", url, "HTTP 200, one H1, canonical, indexable", flush=True)
          for url in live_urls:
              path = urlparse(url).path
              if not path or path == "/" or path == "/privacy-policy.html":
                  continue
              if path not in home_links and url not in home_links:
                  raise RuntimeError("No visible home link to: " + url)
          print("RESULT: All pages fetched with YandexBot User-Agent; this simulates UA, not real Yandex IP or actual indexing.", flush=True)
          PY
