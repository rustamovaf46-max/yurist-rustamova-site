name: Public page security regression
on:
  pull_request:
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'analytics-consent.js'
      - 'tests/test_public_page_attack_surface.py'
      - 'tests/test_reg_ru_deploy_contract.py'
      - 'scripts/reg-ru-deploy.sh'
      - '.github/workflows/public-page-security.yml'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'analytics-consent.js'
      - 'tests/test_public_page_attack_surface.py'
      - 'tests/test_reg_ru_deploy_contract.py'
      - 'scripts/reg-ru-deploy.sh'
      - '.github/workflows/public-page-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public pages and REG.RU deployment contract
        run: |
          sh -n scripts/reg-ru-deploy.sh
          python -m unittest discover -s tests -p 'test_*.py' -v
