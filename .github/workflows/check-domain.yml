name: Проверка домена и HTTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-domain.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: rustamova-domain-status
  cancel-in-progress: false

jobs:
  dns-status:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить публичные DNS, GitHub Pages и HTTPS
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const apex = 'xn--80aafwvmkbibjcl2m.xn--p1ai';
            const expectedA = [
              '185.199.108.153', '185.199.109.153',
              '185.199.110.153', '185.199.111.153'
            ];
            const resolveDns = async (domain, type) => {
              try {
                const response = await fetch(
                  'https://dns.google/resolve?name=' +
                  encodeURIComponent(domain) + '&type=' + type,
                  { signal: AbortSignal.timeout(12000) }
                );
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                return {
                  status: result.Status,
                  answers: (result.Answer || []).filter(a => a.type === (type === 'A' ? 1 : type === 'CNAME' ? 5 : 28))
                    .map(a => a.data)
                };
              } catch (e) {
                return { error: String(e), answers: [] };
              }
            };
            const [ipv4, cname, ipv6] = await Promise.all([
              resolveDns(apex, 'A'),
              resolveDns('www.' + apex, 'CNAME'),
              resolveDns(apex, 'AAAA')
            ]);
            let pages;
            try {
              const resp = await github.rest.repos.getPages({ owner, repo });
              pages = {
                cname: resp.data.cname,
                https_enforced: resp.data.https_enforced,
                html_url: resp.data.html_url,
                status: resp.data.status
              };
            } catch (e) {
              pages = { error: String(e) };
            }
            let https = {};
            for (const hostname of [apex, 'www.' + apex]) {
              try {
                const response = await fetch('https://' + hostname + '/', {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(12000)
                });
                https[hostname] = { http_status: response.status, final_url: response.url };
              } catch(e) {
                https[hostname] = { error: String(e) };
              }
            }
            const expected = new Set(expectedA);
            const actual = new Set(ipv4.answers);
            const status = {
              checked_at: new Date().toISOString(),
              domain: apex,
              apex_a: ipv4,
              apex_aaaa: ipv6,
              www_cname: cname,
              dns_apex_correct: actual.size === expected.size && [...expected].every(ip => actual.has(ip)),
              dns_www_correct: cname.answers.some(a => (a.endsWith('.') ? a.slice(0, -1) : a).toLowerCase() === 'rustamovaf46-max.github.io'),
              github_pages: pages,
              google_ns: await resolveDns(apex, 'NS'),
              registry_whois: await (async () => {
                const net = require('node:net');
                return await new Promise(resolve => {
                  const sock = net.createConnection({host:'whois.tcinet.ru',port:43});
                  let raw = '';
                  let settled = false;
                  const done = data => { if(!settled) { settled=true; sock.destroy(); resolve(data); } };
                  sock.setTimeout(12000);
                  sock.on('connect', () => sock.write(apex + '\\r\\n'));
                  sock.on('data', chunk => { raw += chunk.toString('utf8'); if(raw.length>32000) sock.end(); });
                  sock.on('end', () => {
                    const publicLines = raw.split(/\\r?\\n/).filter(line => /^(domain|nserver|state|registrar|created|paid-till|free-date|source):/i.test(line));
                    done({lines:publicLines, has_data:raw.length>0, unregistered:/not found|no entries found|not registered|не зарегистрирован/i.test(raw), public_not_found_message: /not found|no entries found|not registered|не зарегистрирован/i.test(raw) ? raw.trim().slice(0,300) : undefined});
                  });
                  sock.on('timeout', () => done({error:'TCP Whois timeout'}));
                  sock.on('error', e => done({error:String(e)}));
                });
              })(),
              registry_rdap: await (async () => {
                const url = 'https://rdap.tcinet.ru/rdap/domain/' + apex;
                try {
                  const resp = await fetch(url, { signal: AbortSignal.timeout(16000) });
                  const raw = await resp.text();
                  let obj = {};
                  try { obj = JSON.parse(raw); } catch (_) {}
                  return {
                    http_status: resp.status,
                    domain: obj.ldhName || obj.unicodeName || null,
                    statuses: obj.status || [],
                    nameservers: (obj.nameservers || []).map(n => n.ldhName || n.unicodeName),
                    events: (obj.events || []).filter(e => ['registration','expiration','last changed'].includes(e.eventAction)).map(e => ({action: e.eventAction, date: e.eventDate})),
                    error: !resp.ok ? (obj.title || obj.description || raw.slice(0,240)) : undefined
                  };
                } catch(e) { return {error:String(e)}; }
              })(),
              cloudflare_a: await (async () => {
                try {
                  const resp = await fetch('https://cloudflare-dns.com/dns-query?name=' + apex + '&type=A', {
                    headers: { Accept: 'application/dns-json' }, signal: AbortSignal.timeout(12000)
                  });
                  const data = await resp.json();
                  return { status:data.Status, answers:(data.Answer||[]).map(v=>v.data), authority:(data.Authority||[]).map(v=>v.data) };
                } catch(e) { return {error:String(e)}; }
              })(),
              https
            };
            // Включать HTTPS только после успешной проверки DNS домена.
            status.https_activation = { attempted: false };
            if (status.dns_apex_correct && status.dns_www_correct
                && pages.cname === apex && pages.https_enforced === false) {
              status.https_activation.attempted = true;
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner, repo, https_enforced: true
                });
                status.https_activation.result = 'request_accepted';
                status.github_pages.https_enforced = true;
              } catch(e) {
                status.https_activation.result = 'not_yet_available_or_permission_denied';
                status.https_activation.http_status = e.status || null;
              }
            }
            const path = 'domain-status.json';
            let sha;
            try {
              const r = await github.rest.repos.getContent({owner, repo, path});
              sha = r.data.sha;
            } catch(e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, sha, branch: 'main',
              message: 'Автоматическая проверка DNS и HTTPS',
              content: Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64')
            });
            core.info(JSON.stringify(status, null, 2));
