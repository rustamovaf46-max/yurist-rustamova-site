name: Verify REG.RU live publication and canonical redirects
on:
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * *'  # Daily REG.RU TLS and source consistency check
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-reg-ru-live.yml
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check live published portraits and canonical HTTP redirects
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          domain = "xn--80aafwvmkbibjcl2m.xn--p1ai"
          base = "https://" + domain
          ua = {"User-Agent": "Mozilla/5.0 Zeus-public-site-smoke/1.0",
                "Cache-Control": "no-cache"}
          expected_photos = ("assets/fatima-white-suit-hero.avif", "assets/fatima-portrait-natural.webp")
          errors = []
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=25) as res:
                  return res.status, res.url, res.read()
          # A deployed HTML file must match the current GitHub source; do not
          # allow a green build to mask indefinitely stale hosting publication.
          code, final_url, live = fetch(base + "/")
          source = Path("index.html").read_bytes()
          print("HOME STATUS", code, final_url)
          if code != 200 or final_url != base + "/":
              errors.append("Homepage must return HTTP 200 at the canonical HTTPS URL")
          if live != source:
              print("::warning::REG.RU homepage is not yet the latest main: live SHA256=",
                    hashlib.sha256(live).hexdigest(), "source SHA256=", hashlib.sha256(source).hexdigest())
              last_edit = int(subprocess.check_output(["git","log","-1","--format=%ct","--","index.html"], text=True).strip())
              now = int(subprocess.check_output(["date","+%s"], text=True).strip())
              if now - last_edit > 2 * 60 * 60:
                  errors.append("REG.RU homepage stale more than two hours after update")
          for photo in expected_photos:
              assert photo.encode() in source, "Source homepage does not use " + photo
              code, final, remote = fetch(base + "/" + photo)
              original = Path(photo).read_bytes()
              if code != 200 or final != base + "/" + photo or remote != original:
                  errors.append("Production photo missing or does not match source: " + photo)
              print("PHOTO", photo, "HTTP", code, "exact-sha256=", remote == original)

          # Secure delivery is verified on the actual REG.RU response, not merely
          # by the presence of an Apache config file in GitHub.
          from urllib.error import HTTPError
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  base + "/robots.txt?security-probe=1", headers=ua), timeout=25) as response:
                  security_headers = {name.lower(): value.lower() for name, value in response.headers.items()}
              required = {
                  "x-content-type-options": "nosniff",
                  "x-frame-options": "deny",
                  "referrer-policy": "strict-origin-when-cross-origin",
              }
              for name, value in required.items():
                  if security_headers.get(name) != value:
                      errors.append("Live security header missing/wrong: " + name)
              csp = security_headers.get("content-security-policy", "")
              if "frame-ancestors 'none'" not in csp or "object-src 'none'" not in csp:
                  errors.append("Live CSP missing anti-framing and object-src controls")
              if "max-age=" not in security_headers.get("strict-transport-security", ""):
                  errors.append("Live HSTS header missing")
              print("SECURITY LIVE", "headers verified" if not [
                  e for e in errors if "security" in e.lower() or "CSP" in e
              ] else "security headers not fully verified")
          except Exception as exc:
              errors.append("Live security-header request failed: " + type(exc).__name__)

          # Do not follow redirects here: report the real response status and Location.
          for host in (domain, "www." + domain):
              for path in ("/", "/privacy-policy.html"):
                  url = "http://" + host + path
                  proc = subprocess.run(["curl", "--silent", "--show-error", "--connect-timeout", "7",
                      "--max-time", "18", "-o", "/dev/null", "-w", "%{http_code} %{redirect_url}", url],
                      text=True, capture_output=True)
                  parts = proc.stdout.strip().split(" ", 1)
                  status = parts[0] if parts else ""
                  redirect = parts[1].strip() if len(parts) > 1 else ""
                  expected = base + path
                  print("HTTP CANONICAL", url, "=>", status, redirect)
                  if proc.returncode or status != "301" or redirect != expected:
                      errors.append(url + ": expected 301 to " + expected)

          if errors:
              for problem in errors:
                  print("::error::" + problem)
              raise SystemExit(1)
          print("LIVE PASS: REG.RU homepage, approved portraits and HTTP 301 redirects")
          PY
