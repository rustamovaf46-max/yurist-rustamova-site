name: Проверка мобильной вёрстки и стабильного открытия

on:
  push:
    paths:
      - index.html
      - .github/workflows/validate-price-layout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python and headless browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium --with-deps
      - name: Verify mobile gutters, overflow, opening position and price layout
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          from playwright.sync_api import sync_playwright
          url = pathlib.Path("index.html").resolve().as_uri()
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              for width in [280, 320, 360, 375, 390, 430, 700, 768, 1024, 1440]:
                  page = browser.new_page(viewport={"width": width, "height": 880}, device_scale_factor=1)
                  page.goto(url)
                  initial_y = page.evaluate("window.scrollY")
                  assert initial_y <= 1, f"{width}: page did not open at top: {initial_y}"
                  section = page.locator(".section-price")
                  section.scroll_into_view_if_needed()
                  data = page.evaluate("""() => {
                    const sel=(s)=>document.querySelector(s);
                    const box=(s)=>{let x=sel(s), r=x.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,clientWidth:x.clientWidth,scrollWidth:x.scrollWidth, height:r.height}};
                    const overflow=(s)=>Array.from(document.querySelectorAll(s)).map(x=>({text:(x.textContent||"").trim().slice(0,80),clientWidth:x.clientWidth,scrollWidth:x.scrollWidth}));
                    return {eyebrow:box(".section-price .eyebrow"),
                      heading:box(".section-price h2"),
                      word:box(".section-price h2 em"),
                      panel:box(".section-price .price-panel"),
                      price:box(".section-price .price-amount"),
                      video:box(".section-video .video-player-frame"),
                      pageScrollWidth:document.documentElement.scrollWidth,
                      bodyScrollWidth:document.body.scrollWidth,
                      videoText:overflow(".video-player-top span,.video-player-bottom span"),
                      leftBorder:getComputedStyle(sel(".section-price .price-panel")).borderLeftWidth,
                      rightBorder:getComputedStyle(sel(".section-price .price-panel")).borderRightWidth,
                      viewport:window.innerWidth
                    };
                  }""")
                  print(width, data, flush=True)
                  for name in ["eyebrow","word","panel","price"]:
                      b=data[name]
                      assert b["left"] >= -1 and b["right"] <= width+1, f"{width}: {name} visually clipped: {b}"
                  if width <= 700:
                      for name in ["heading","eyebrow","panel"]:
                          left=data[name]["left"]
                          right_gap=width-data[name]["right"]
                          assert 16 <= left <= 20, f"{width}: {name} left gutter is not aligned: {data[name]}"
                          assert 16 <= right_gap <= 20, f"{width}: {name} right gutter is not aligned: {data[name]}"
                      assert 16 <= data["video"]["left"] <= 20 and 16 <= width-data["video"]["right"] <= 20, f"{width}: video frame gutters differ: {data['video']}"
                      assert data["pageScrollWidth"] <= width and data["bodyScrollWidth"] <= width, f"{width}: horizontal page overflow: {data}"
                      for item in data["videoText"]:
                          assert item["scrollWidth"] <= item["clientWidth"]+2, f"{width}: clipped video text: {item}"
                  articles=page.locator(".legal-article")
                  assert articles.count()==4, f"{width}: expected 4 article cards"
                  assert page.locator('.mobile-nav a[href="#articles"]').count()==1, "missing Yandex Android articles navigation"
                  for card in articles.all():
                      rect=card.bounding_box()
                      assert rect and rect["x"]>=-1 and rect["x"]+rect["width"]<=width+1, f"{width}: article card clipped"
                  assert float(data["leftBorder"].replace("px","")) >= 1, f"{width}: missing price card left border"
                  assert float(data["rightBorder"].replace("px","")) >= 1, f"{width}: missing price card right border"
                  for label in ["word","eyebrow","price"]:
                      b=data[label]
                      assert b["scrollWidth"] <= b["clientWidth"]+2, f"{width}: text overflow in {label}: {b}"
                  if width in [320,390,1440]:
                      page.screenshot(path=f"price-{width}.png",full_page=True)
                  if width <= 430:
                      page.evaluate("window.scrollTo(0, Math.floor(document.body.scrollHeight/2))")
                      page.reload()
                      page.wait_for_timeout(80)
                      restored_y=page.evaluate("window.scrollY")
                      assert restored_y <= 1, f"{width}: reload restored a middle-page position: {restored_y}"
                  page.close()
              browser.close()
          PY
      - name: Mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-responsive-screenshots
          path: price-*.png
          if-no-files-found: ignore
