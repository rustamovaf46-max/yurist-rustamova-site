name: ZEUS automated WCAG 2.2 browser accessibility audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/a11y_axe_audit.py'
      - '.github/workflows/accessibility-audit.yml'

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser audit tools
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          npm install --no-save --ignore-scripts axe-core@4.10.3
      - name: Analyze real rendered pages (not a WCAG certificate)
        run: python scripts/a11y_axe_audit.py
      - name: Retain accessibility findings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-wcag22-browser-audit
          path: |
            reports/zeus-wcag22-browser-audit.json
            reports/zeus-wcag22-browser-audit.md
          if-no-files-found: warn
