name: Проверка сайта на Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-netlify.yml'

permissions:
  contents: write

concurrency:
  group: rustamova-netlify-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить Netlify HTTPS, страницы и контакты
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const base = 'https://prismatic-pony-7528de.netlify.app';
            const paths = [
              '/', '/sitemap.xml', '/robots.txt',
              '/googled3be2855f213bfb7.html',
              '/poryadok-polzovaniya-kvartiroy.html',
              '/privacy-policy.html',
              '/assets/fatima-portrait.webp',
              '/assets/hero-handshake.webp',
              '/assets/hero-mobile.webp',
              '/assets/video-poster.webp',
              '/assets/fatima-promo.mp4'
            ];
            const checks = {};
            for (const path of paths) {
              try {
                const isMedia = path.startsWith('/assets/');
                const response = await fetch(base + path, {
                  method: isMedia ? 'HEAD' : 'GET',
                  redirect: 'follow',
                  signal: AbortSignal.timeout(22000)
                });
                const type = response.headers.get('content-type') || '';
                const result = {
                  http_status: response.status,
                  final_url: response.url,
                  content_type: type,
                  ok: response.ok && response.url.startsWith('https://'),
                };
                if (path === '/') {
                  const body = await response.text();
                  result.has_rustamova = body.includes('Рустамова');
                  result.has_phone = body.includes('79099282398');
                  result.has_max = body.includes('max.ru');
                  result.title = body.match(/<title>([^<]*)<\/title>/)?.[1] || '';
                  result.has_layout_fix = body.includes('Correction of video/pricing overflow');
                  result.no_obsolete_wix_script = !body.includes('wix-site-script');
                  result.has_scroll_fix = body.includes('setTimeout(resetToStart, 500)');
                  result.ok = result.ok && result.has_rustamova &&
                    result.has_phone && result.has_max &&
                    result.has_layout_fix && result.no_obsolete_wix_script &&
                    result.has_scroll_fix;
                }
                if (path === '/googled3be2855f213bfb7.html') {
                  const body = await response.text();
                  result.verified = body.includes('google-site-verification: googled3be2855f213bfb7.html');
                  result.ok = result.ok && result.verified;
                }
                if (path.endsWith('.webp')) result.ok = result.ok && type.includes('image/webp');
                if (path.endsWith('.mp4')) result.ok = result.ok && type.includes('video/mp4');
                if (path.endsWith('.html') && path !== '/googled3be2855f213bfb7.html')
                  result.ok = result.ok && type.includes('text/html');
                checks[path] = result;
              } catch (e) {
                checks[path] = {ok:false,error:String(e),code:e.cause?.code||null};
              }
            }
            const status = {
              checked_at: new Date().toISOString(),
              public_netlify_url: base,
              all_checks_passed: Object.values(checks).every(x => x.ok === true),
              checks
            };
            const filename = 'netlify-status.json';
            let sha;
            try {
              const r = await github.rest.repos.getContent({owner,repo,path:filename});
              sha = r.data.sha;
            } catch(e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path:filename, sha, branch:'main',
              message:'Автоматическая проверка доступности Netlify',
              content:Buffer.from(JSON.stringify(status,null,2)+'\n').toString('base64')
            });
            core.info(JSON.stringify(status));
