name: ZEUS Live HTTP Security
on:
  pull_request:
    paths:
      - 'scripts/check_live_security.py'
      - '.github/workflows/live-http-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public headers and blocked sensitive paths
        run: python scripts/check_live_security.py
