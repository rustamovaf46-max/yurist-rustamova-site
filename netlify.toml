# Static website, with unpublished SEO drafts and internal diagnostics excluded.
[build]
  command = "test -s index.html && test -s googled3be2855f213bfb7.html && mkdir -p netlify-public && cp ./*.html ./robots.txt ./sitemap.xml netlify-public/ && cp -R ./assets netlify-public/"
  publish = "netlify-public"
